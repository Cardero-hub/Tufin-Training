apiVersion: apps/v1
kind: Deployment
metadata:
  name: poc-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: poc-test
  template:
    metadata:
      labels:
        app: poc-test
    spec:
      containers:
      - name: poc-test
        image: nginxdemos/hello
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: poc-test-service
spec:
  type: NodePort
  selector:
    app: poc-test
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30090
